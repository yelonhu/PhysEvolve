[pytest]
markers =
    slow: long-running tests (skipped by default on CI; run locally as needed)
addopts = --import-mode=importlib
testpaths =
    physevolve/tests
    evaluation/physbench/tests
    evaluation/contphy/tests
    evaluation/common/tests
norecursedirs = .* build dist CVS _darcs {arch} *.egg venv third_party outputs CLEVRER
